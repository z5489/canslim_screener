name: Fetch Momentum Stock Batches

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch to run (1-6, or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.set-matrix.outputs.batches }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" == "schedule" ] || [ "${{ github.event.inputs.batch }}" == "all" ]; then
            echo "batches=[1, 2, 3, 4, 5, 6]" >> $GITHUB_OUTPUT
          else
            echo "batches=[${{ github.event.inputs.batch }}]" >> $GITHUB_OUTPUT
          fi

  fetch:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        batch: ${{ fromJson(needs.setup.outputs.batches) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Fetch batch ${{ matrix.batch }} data
        run: python scripts/fetch_batch.py --batch ${{ matrix.batch }} --output data/batch_${{ matrix.batch }}.json

      - name: Merge into dated output CSV
        run: python scripts/merge_output.py --batch data/batch_${{ matrix.batch }}.json --output-dir frontend/output/

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/batch_${{ matrix.batch }}.json frontend/output/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update batch ${{ matrix.batch }} $(date +%Y-%m-%d)"
            git pull --rebase origin main || git pull --rebase origin master
            git push
          else
            echo "No changes to commit"
          fi
